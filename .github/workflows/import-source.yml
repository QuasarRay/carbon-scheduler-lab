name: Import carbon-scheduler dev-rs-v2 snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          path: target
          fetch-depth: 0

      - name: Check out pinned source with submodules
        uses: actions/checkout@v4
        with:
          repository: QuasarRay/carbon-scheduler
          ref: 09419c022ba0a2e1042c3a9761fdf35a94345cf0
          submodules: recursive
          path: source
          fetch-depth: 1

      - name: Materialize and push the source snapshot
        shell: bash
        run: |
          rsync -a --delete --exclude='.git' source/ target/
          cd target

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          gitlink_count="$(git ls-files --stage | awk '$1 == "160000" { count++ } END { print count + 0 }')"
          if [ "$gitlink_count" -ne 0 ]; then
            echo "::error::The imported snapshot still contains $gitlink_count gitlink entries."
            exit 1
          fi

          tracked_count="$(git ls-files | wc -l)"
          if [ "$tracked_count" -lt 12600 ]; then
            echo "::error::Expected at least 12600 tracked files after submodule materialization; found $tracked_count."
            exit 1
          fi

          test -f vendor/github.com/carbonengine/vcpkg-registry/README.md
          test -f vendor/github.com/microsoft/vcpkg/README.md

          git commit -m "Import carbon-scheduler dev-rs-v2 snapshot"
          git push origin HEAD:main
